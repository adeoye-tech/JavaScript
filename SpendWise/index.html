<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SpendWise</h1>
        <p>Personal Expense Tracker Dashboard</p>
    </header>
    <main>
        <section class="summary">
            <div class="card">
                <h2>Total Balance</h2>
                <p id="balance">#0</p>
                </div>

                <div class="card">
                    <h2>Total Income</h2>
                    <p id="income">#0</p>
                </div>

                 <div class="card">
                    <h2>Total Expenses</h2>
                    <p id="expenses">#0</p>
                </div>
            </section>

            <section class="transaction-form">

    <h2>Add Transaction</h2>

    <form id="expense-form">

        <div>
            <label for="description">Description</label>
            <input
                type="text"
                id="description"
                placeholder="Bought groceries">
        </div>

        <div>
            <label for="amount">Amount</label>
            <input
                type="number"
                id="amount"
                placeholder="5000">
        </div>

        <div>
            <label for="type">Type</label>

            <select id="type">

                <option value="income">Income</option>

                <option value="expense">Expense</option>

            </select>

        </div>

        <div>
            <label for="date">Date</label>

            <input
                type="date"
                id="date">
        </div>

        <button type="submit">
            Add Transaction
        </button>

    </form>

</section>

    <div id="loading">
        Loading transactions
    </div>
    
    <section class="transactions">
        <h2>Transaction History</h2>
        <input type="text"
        id="search"
        placeholder="Search Transaction...">

        

        <div class="filter-buttons">
    <button id="all-btn">ALL</button>
    <button id="income-btn">Income</button>
    <button id="expense-btn">Expense</button>
    <button id="newest-btn">Newest First</button>
    <button id="oldest-btn">Oldest First</button>
    <button id="highest-btn">Highest Amount</button>
    <button id="lowest-btn">Lowest Amount</button>
    <button id="export-btn">Export JSON</button>
    <button id="theme-btn">🌙 Dark Mode</button>

    </div>

            <div id="empty-state">
                <p>No transactions yet.</p>
                <p>Start adding your first transaction.</p>
            </div>
            <div id="transaction-list"></div>
            
    </section>

    <section class="chart-section">

    <h2>Expense Analysis</h2>

    <div class="chart">

        <div class="chart-item">

            <span>Income</span>

            <div class="bar income-bar" id="income-bar"></div>

        </div>

        <div class="chart-item">

            <span>Expense</span>

            <div class="bar expense-bar" id="expense-bar"></div>

        </div>

    </div>

</section>
    </main>


    <script src="js/app.js"></script>
</body>
</html>
